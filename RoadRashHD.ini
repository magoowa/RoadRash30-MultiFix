; ======================================================================================================
;  RoadRash30-MultiFix settings
; ======================================================================================================
;  * Lines starting with ';' are comments. Every option below is shown with its default value.
;  * 1 = on, 0 = off (unless the text says otherwise). Changes apply the next time the game starts.
;  * Most options can also be switched in the installer/launcher window; the launcher writes this file.
;  * Delete this file to get a fresh one with the defaults (the installer creates it again).
;  * Something wrong? Set Profile=1 in [Debug] and send RoadRashHD.log from the game folder.
; ======================================================================================================

[Graphics]
; Master switch of the whole MultiFix renderer. 0 = the game draws exactly like the original.
Enabled=1
; Direct3D 11 hardware renderer. If it cannot start, the CPU renderer is used automatically.
; 0 = always use the CPU renderer.
D3D11=1
; Smooth (bilinear) textures of the 3D game environment in races: road, buildings, sky.
; Direct3D renderer only. Menus and text are not affected (see SmoothText).
TextureFilter=1
; Wait for the monitor refresh before showing each frame (removes tearing, adds a little latency).
VSync=0
; Bilinear filtering of the text and the interface: the menus and the race HUD / text are smoothed when scaled up
; (0 = crisp pixels). Not shown in the launcher. The HUD part needs the Direct3D renderer.
SmoothText=0
; Resolution preset for weaker graphics: High = window size, Medium = 720p, Low = 540p, Minimum = 480p,
; Auto = starts at window size and, if races run too slowly, lowers the height for the next start.
; A fixed RenderHeight (below, or chosen in the game's resolution menu) overrides this. Not shown in the launcher.
Quality=High
; Fixed height in pixels at which the 3D scene is drawn; it is scaled to the window.
; 0 = match the window size (best quality). Also set by the game's own resolution menu.
RenderHeight=0
; Height chosen by Quality=Auto for the next start (written by the game, 0 = none yet). Normally leave it alone.
AutoRenderHeight=0
; Place the Direct3D picture on its own child window (helps with window and fullscreen switching).
; -1 = automatic (recommended), 1 = always, 0 = never.
ChildSurface=-1

[Performance]
; Windows power throttling off for the game, 1 ms timer, slightly raised priority. Helps integrated GPUs/laptops.
HighPerformance=1
; 0 = standard presentation (recommended). 1 = waitable swap chain with one queued frame and tearing present:
; on an Intel Iris Xe laptop on battery it dropped 60 fps to 45 fps. (Launcher: "iGPU Performance Boost" on = 0.)
LowLatency=0

[Window]
; Widescreen game: the whole game uses the full window / screen with a wide field of view, whatever its shape.
; 0 = the original 4:3 picture (a 4:3 window; in fullscreen or a wider window it is centred with black bars).
WideWindow=1
; Client size of the window in pixels. 0 = automatic (16:9, 85 % of the screen height); set both Width and Height to
; use your own size. A negative value leaves the window exactly as the game creates it.
Width=0
Height=0
; Alt+Enter and F11 switch between window and borderless fullscreen.
AltEnterFullscreen=1
; Start in fullscreen instead of a window.
StartFullscreen=1
; Hide the mouse cursor at start and after 3 s without mouse movement (it returns when the mouse moves).
AutoHideCursor=1
; Dual monitor UX: the mouse cursor is not confined to the game window and the game is not minimized when it loses focus (for example when
; you click on another monitor; the music still stops). 0 = as in the original.
DualMonitorUX=0

[Text]
; Fix garbled special characters (trademark sign, quotes, accents) caused by Windows' UTF-8 system setting.
FixEncoding=1

[Input]
; Analog throttle on the right trigger of an Xbox pad. The game reads the trigger as a button (full throttle above 12% pressure), so a light touch
; gave full power and slow speeds could not be held. 1 = the throttle follows the pressure of the trigger.
AnalogThrottle=1
; Speed (default): the trigger sets a target speed and the throttle holds it (a light press = a slow, steady speed; the bike does not
; accelerate beyond it). Pressure: the trigger sets the power of the throttle directly (the bike keeps accelerating while it is held).
ThrottleMode=Speed
; Speed mode: the speed of a fully pressed trigger (about 1800 is a normal race speed, 4500 a very fast one) and how far below the target
; the throttle is still full (a smaller number = a sharper control).
ThrottleTopSpeed=4500
ThrottleBand=700
; Speed mode: how the pressure of the trigger becomes a target speed: top speed * (pressure)^ThrottleSpeedCurve. 1 = linear, smaller = a light
; press already gives a useful slow speed (0.5 default: about 640 at 8/255, 1160 at 20, 1720 at 40, 2800 at 100).
ThrottleSpeedCurve=0.5
; Speed mode: the trigger value (0-255) at which the throttle starts (the trigger of an Xbox pad rests at 0-3).
ThrottleStart=3
; Speed mode: the share of time (percent) the throttle is on when the bike holds a steady slow speed; the controller adjusts around it.
ThrottleBaseDuty=36
; Pressure mode only: shape of the power (1 = linear, larger = gentler at the start, 1-4).
ThrottleCurve=1.0
; How far the right trigger must be pressed before the game counts it as pressed (0-255; the game itself uses 30, which a light press on an
; Xbox pad does not reach, so the throttle fell to zero). The analog range starts here.
ThrottleThreshold=14
; Pressure mode only: the weakest throttle when the trigger is pressed a little (1-16 of 32).
ThrottleMinimum=2
; Let the controller answer the game's message boxes (A = OK / Yes, B = Cancel / No), e.g. when quitting.
PadDialogs=1
; Controller stick steering: make right turn exactly as gentle as left (the original mapping was lopsided).
SymmetricSteering=1
; DualSense / DualShock 4 over HID (issue #4), experimental and untested without the pad: the Bluetooth reports are understood and the d-pad steers
; and chooses in the menus (diagonals too). The HID interface fix for a DualSense that scrolled the menus upward by itself is always on.
DualSense=0
; Keyboard and controller work at the same time, whatever control device the loaded profile has selected
; (the game normally uses only the selected one). 0 = the original behaviour.
KeyboardAndPad=1
; Stutter fix: search for controllers in a background thread (the original code froze the game ~165 ms every 2 s).
AsyncControllerScan=1

[Game]
; Game text language: Auto (the game's own setting), English, French, German, Italian or Spanish.
; The language DLLs are in the TEXT folder of the game.
Language=Auto
; Sprite position interpolation: update far riders, cars and pedestrians every frame instead of every 2-8 frames.
FullRateObjects=1
; Repair the broken left strip of the GAME LOADING picture.
FixPostcards=1
; Fix the swapped colours of the Rat and Super bikes in the race (they now match the showroom).
FixBikeColors=1
; Sprite fixes: the damaged shadow of the first frame of the punch (drawn far from the bike in the original game) and the floating
; buildings (the red barn, the brown wooden shop with the sign, the white house), which are lowered to the ground.
SpriteFixes=1
; How far the two buildings are lowered, in rows of their full-size picture (the red barn picture is 131 rows high, the shop 115).
; Larger = lower. Decimal numbers are allowed.
LowerRedBarn=2
LowerBrownShop=3
; The white house with the dark roof (HOUSEB2); its picture has 10 empty rows at the bottom, 132 rows in all.
LowerWhiteHouse=10
; Skip the studio logos and the intro movie (the menu music still plays).
SkipIntro=0
; The Load Game dialog opens with the save you used last already selected (the controller can operate it:
; D-pad up / down choose, A opens, B cancels). 0 = off.
RememberLastSave=1
; The save used last, filled in by the game itself (full path). Leave it empty or edit it by hand.
LastSave=
; Volume of the videos (.mp4), 0-100 percent of the game's volume. 100 = unchanged. (Launcher: FMV Volume slider.)
VideoVolume=100

[Audio]
; Pedestrian voices: each kind of pedestrian shouts with its own pool of voices (table: PedestrianVoices.ini next to this file, you can edit it).
; The flag girls and the people at the start react to a collision too. 0 = the game's own voices.
PedestrianVoiceRules=1
; Louder pedestrians: the voices of people other than the rider (bystanders, bikers, tourists, skaters, cyclists, cops, ...) and the
; footsteps. The game plays them at a fixed -17.6 dB, far below the rider's own sounds, so they are barely heard.
; 1 = the sounds themselves are made louder (a louder copy is made once in %LOCALAPPDATA%\RoadRashMultiFix\audio from the game's
; own files, which are never changed; a soft limiter keeps the peaks from clipping). 0 = the original levels.
LouderPedestrians=1
; How much louder the sounds themselves are, in dB (0-12; 6 = twice the amplitude). The footsteps get twice as much again.
PedestrianGainDb=3
; Reduces the attenuation the game applies to those sounds, in percent (0 = as the game sets it, 60 = the -17.6 dB become about -7 dB,
; 100 = no attenuation). The first play / volume events of every effect are written to RoadRashHD.log ("sound: ...").
PedestrianVolumeRelief=60
; The same for the pedestrians' voices alone (not the thump or the footsteps): 100 = they play as loud as the rider's own sounds,
; so they are not drowned by the crash and grunt of a collision.
PedestrianVoiceRelief=100
; 1 = the woman pedestrian that has no voice in the game's data (record 1 of bank 0) gets the unused voices FG1_WATC and FG2_EEK.
FemaleVoiceFallback=1
; Minimum time in milliseconds between two first-reaction voices of pedestrians (0 = no limit). The game lets every pedestrian in reach
; shout at the rider's blow, so a fight can make a chorus.
PedestrianVoiceGapMs=120

[Debug]
; Everything for logs and troubleshooting lives here (all off by default); nothing in this section changes how the game plays.
; Write frame-time statistics to RoadRashHD.log every few seconds (for troubleshooting and bug reports).
Profile=0
; Save a screenshot (.bmp, at most 48) of the rendered frame to the game folder every N seconds (0 = off).
; For troubleshooting only.
DumpFrameEverySeconds=0
; Those screenshots are made N times smaller than the window (1 = full size, 2 = half size, ...).
DumpScale=2
; Picture glitches (streaks, stretched textures): 1 = quads with extreme corners (outside the picture, not finite, huge texture
; coordinates) are written to RoadRashHD.log ("quad diagnostics: ...") and the frame is saved as RoadRashHD_glitch_N.bmp (full size, at
; most 8). Send the log and the pictures with a bug report. Direct3D renderer only.
QuadDiagnostics=0
