; ======================================================================================================
;  RoadRash30-MultiFix settings
; ======================================================================================================
;  * Lines starting with ';' are comments. Every option below is shown with its default value.
;  * 1 = on, 0 = off (unless the text says otherwise). Changes apply the next time the game starts.
;  * Most options can also be switched in the installer/launcher window; the launcher writes this file.
;  * Delete this file to get a fresh one with the defaults (the installer creates it again).
;  * Something wrong? Set Profile=1 in [Graphics] and send RoadRashHD.log from the game folder.
; ======================================================================================================

[Graphics]
; Master switch of the whole MultiFix renderer. 0 = the game draws exactly like the original.
Enabled=1
; Direct3D 11 hardware renderer. If it cannot start, the CPU renderer is used automatically.
; 0 = always use the CPU renderer.
D3D11=1
; Smooth (bilinear) textures of the 3D game environment in races: road, buildings, sky.
; Direct3D renderer only. Menus and text are not affected (see SmoothText).
TextureFilter=1
; Wait for the monitor refresh before showing each frame (removes tearing, adds a little latency).
VSync=0
; Bilinear filtering of the text and the interface: the menus and the race HUD / text are smoothed when scaled up
; (0 = crisp pixels). Not shown in the launcher. The HUD part needs the Direct3D renderer.
SmoothText=0
; Resolution preset for weaker graphics: High = window size, Medium = 720p, Low = 540p, Minimum = 480p,
; Auto = starts at window size and, if races run too slowly, lowers the height for the next start.
; A fixed RenderHeight (below, or chosen in the game's resolution menu) overrides this. Not shown in the launcher.
Quality=High
; Fixed height in pixels at which the 3D scene is drawn; it is scaled to the window.
; 0 = match the window size (best quality). Also set by the game's own resolution menu.
RenderHeight=0
; Height chosen by Quality=Auto for the next start (written by the game, 0 = none yet). Normally leave it alone.
AutoRenderHeight=0
; Place the Direct3D picture on its own child window (helps with window and fullscreen switching).
; -1 = automatic (recommended), 1 = always, 0 = never.
ChildSurface=-1
; Write frame-time statistics to RoadRashHD.log every few seconds (for troubleshooting and bug reports).
Profile=0
; Save a screenshot (.bmp, at most 48) of the rendered frame to the game folder every N seconds (0 = off).
; For troubleshooting only.
DumpFrameEverySeconds=0
; Those screenshots are made N times smaller than the window (1 = full size, 2 = half size, ...).
DumpScale=2

[Performance]
; Windows power throttling off for the game, 1 ms timer, slightly raised priority. Helps integrated GPUs/laptops.
HighPerformance=1
; 0 = standard presentation (recommended). 1 = waitable swap chain with one queued frame and tearing present:
; on an Intel Iris Xe laptop on battery it dropped 60 fps to 45 fps. (Launcher: "iGPU Performance Boost" on = 0.)
LowLatency=0

[Window]
; Widescreen game: the whole game uses the full window / screen with a wide field of view, whatever its shape.
; 0 = the original 4:3 picture (a 4:3 window; in fullscreen or a wider window it is centred with black bars).
WideWindow=1
; Client size of the window in pixels. 0 = automatic (16:9, 85 % of the screen height); set both Width and Height to
; use your own size. A negative value leaves the window exactly as the game creates it.
Width=0
Height=0
; Alt+Enter and F11 switch between window and borderless fullscreen.
AltEnterFullscreen=1
; Start in fullscreen instead of a window.
StartFullscreen=1
; Hide the mouse cursor at start and after 3 s without mouse movement (it returns when the mouse moves).
AutoHideCursor=1

[Text]
; Fix garbled special characters (trademark sign, quotes, accents) caused by Windows' UTF-8 system setting.
FixEncoding=1

[Input]
; Let the controller answer the game's message boxes (A = OK / Yes, B = Cancel / No), e.g. when quitting.
PadDialogs=1
; Controller stick steering: make right turn exactly as gentle as left (the original mapping was lopsided).
SymmetricSteering=1
; Keyboard and controller work at the same time, whatever control device the loaded profile has selected
; (the game normally uses only the selected one). 0 = the original behaviour.
KeyboardAndPad=1
; Stutter fix: search for controllers in a background thread (the original code froze the game ~165 ms every 2 s).
AsyncControllerScan=1

[Game]
; Game text language: Auto (the game's own setting), English, French, German, Italian or Spanish.
; The language DLLs are in the TEXT folder of the game.
Language=Auto
; Sprite position interpolation: update far riders, cars and pedestrians every frame instead of every 2-8 frames.
FullRateObjects=1
; Repair the broken left strip of the GAME LOADING picture.
FixPostcards=1
; Fix the swapped colours of the Rat and Super bikes in the race (they now match the showroom).
FixBikeColors=1
; Skip the studio logos and the intro movie (the menu music still plays).
SkipIntro=0
; The Load Game dialog opens with the save you used last already selected (the controller can operate it:
; D-pad up / down choose, A opens, B cancels). 0 = off.
RememberLastSave=1
; The save used last, filled in by the game itself (full path). Leave it empty or edit it by hand.
LastSave=
; Volume of the videos (.mp4), 0-100 percent of the game's volume. 100 = unchanged. (Launcher: FMV Volume slider.)
VideoVolume=100
