; RoadRash30-MultiFix settings. 1 = on, 0 = off. Changes apply the next time the game starts.
; Every option can also be switched in the installer/launcher window.

[Graphics]
; Direct3D 11 hardware renderer. If it cannot start, the CPU renderer is used automatically.
; 0 = always use the CPU renderer.
D3D11=1
; Smooth (bilinear) textures of the 3D game environment in races: road, buildings, sky.
; Direct3D renderer only. Menus and text are not affected (see SmoothText).
TextureFilter=1
; Wait for the monitor refresh before showing each frame (removes tearing, adds a little latency).
VSync=0
; Bilinear filtering of the text and the interface: the menus and the race HUD / text are smoothed when scaled up
; (off = crisp pixels). Not shown in the launcher. The HUD part needs the Direct3D renderer.
SmoothText=0
; Resolution preset for weaker graphics: High = window size, Medium = 720p, Low = 540p, Minimum = 480p,
; Auto = starts at window size and, if races run too slowly, lowers the height for the next start.
; A fixed RenderHeight (below, or chosen in the game's resolution menu) overrides this. Ini only.
Quality=High

[Performance]
; Windows power throttling off for the game, 1 ms timer, slightly raised priority. Helps integrated GPUs/laptops.
HighPerformance=1
; 0 = standard presentation (recommended). 1 = waitable swap chain with one queued frame and tearing present:
; on an Intel Iris Xe laptop on battery it dropped 60 fps to 45 fps. (Launcher: "Intel iGPU Battery Boost" on = 0.)
LowLatency=0

[Window]
; Open the game in a widescreen (16:9) window instead of the old 4:3 one.
WideWindow=1
; Alt+Enter and F11 switch between window and borderless fullscreen.
AltEnterFullscreen=1
; Start in fullscreen instead of a window.
StartFullscreen=1
; Hide the mouse cursor at start and after 3 s without mouse movement (it returns when the mouse moves).
AutoHideCursor=1

[Text]
; Fix garbled special characters (trademark sign, quotes, accents) caused by Windows' UTF-8 system setting.
FixEncoding=1

[Input]
; Let the controller answer the game's message boxes (A = OK / Yes, B = Cancel / No), e.g. when quitting.
PadDialogs=1
; Controller stick steering: make right turn exactly as gentle as left (the original mapping was lopsided).
SymmetricSteering=1
; Stutter fix: search for controllers in a background thread (the original code froze the game ~165 ms every 2 s).
AsyncControllerScan=1

[Game]
; Game text language: Auto (the game's own setting), English, French, German, Italian or Spanish.
; The language DLLs are in the TEXT folder of the game.
Language=Auto
; Sprite position interpolation: update far riders, cars and pedestrians every frame instead of every 2-8 frames.
FullRateObjects=1
; Repair the broken left strip of the GAME LOADING picture.
FixPostcards=1
; Fix the swapped colours of the Rat and Super bikes in the race (they now match the showroom).
FixBikeColors=1
; Skip the studio logos and the intro movie (the menu music still plays).
SkipIntro=0
; Volume of the videos (.avi and .mp4), 0-100 percent of the game's volume. 100 = unchanged.
VideoVolume=100

; Advanced (not in the launcher; remove the leading ';' to use):
; [Graphics]
; RenderHeight=1080   ; draw the 3D scene at this fixed height and scale it to the window.
;                     ; Default 0 = match the window size.
; Profile=1           ; write frame-time statistics to RoadRashHD.log (for troubleshooting).
